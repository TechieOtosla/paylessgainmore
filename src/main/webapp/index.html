<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PayLessGainMore</title>
  <meta name="description" content="PayLessGainMore computer store">
  <meta name="keywords" content="computer store, hardware, software">
</head>
<body>
  <h1 id="welcome"></h1>
  <script>
    function getCookie(name) {
      var m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
      return m ? decodeURIComponent(m[1]) : null;
    }
    var user = getCookie("username");
    if (!user) {
      location.href = "register.html";
    } else {
      document.getElementById("welcome").textContent = "Welcome " + user;
    }
  </script>
</body>
</html>
